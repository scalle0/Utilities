# hostapd config for the ScAIdev captive-portal demo.
# Edit `interface=` to match the wireless interface name on your UNO Q
# (check with: ip link). Common names: wlan0, wlp1s0, wlan1.

interface=wlan0
driver=nl80211

ssid=ScAIdev

# 2.4 GHz, channel 6. Pick a channel not crowded in your venue.
hw_mode=g
channel=6

# Open network. No password. That's the point of the demo.
auth_algs=1
wpa=0

# Allow any client to associate.
macaddr_acl=0
ignore_broadcast_ssid=0
