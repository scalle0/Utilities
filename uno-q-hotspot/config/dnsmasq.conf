# dnsmasq config for the ScAIdev captive-portal demo.
#
# Does two things:
#   1) DHCP: hands out IPs in 192.168.4.0/24 to clients on wlan0.
#   2) DNS hijack: address=/#/192.168.4.1 means EVERY domain resolves
#      to the UNO Q's AP IP, which is what causes phones to pop the
#      captive-portal sheet on connect.
#
# Edit interface= to match your AP interface (same as hostapd.conf).

interface=wlan0
bind-interfaces

# DHCP range and lease time.
dhcp-range=192.168.4.10,192.168.4.250,12h
dhcp-option=3,192.168.4.1       # default gateway = us
dhcp-option=6,192.168.4.1       # DNS = us

# DNS hijack: answer every query with our own IP.
address=/#/192.168.4.1

# Don't read /etc/resolv.conf (we don't want upstream DNS resolution).
no-resolv
no-poll
